[project]
name = "support-copilot-backend"
version = "1.0.0"
description = "Support Copilot: FastAPI service, MCP stdio server, local TF-IDF RAG"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
